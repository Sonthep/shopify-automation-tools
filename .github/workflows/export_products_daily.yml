name: Daily Shopify Product Export to Google Sheets

on:
  schedule:
    # 02:00 AM ICT (UTC+7) = 19:00 UTC previous day
    - cron: '0 19 * * *'
  workflow_dispatch: # ปุ่มสำหรับกดรันเองได้ตลอดเวลาบนหน้าเว็บ GitHub

jobs:
  export_products:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests gspread pandas python-dotenv

      - name: Run Export Script
        env:
          SHOP_NAME: ${{ secrets.SHOP_NAME }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
          EXPORT_SHEET_NAME: "Products Export"
        run: |
          python scripts/export_products_to_sheet.py
